[package]
name = "ployz-internal-machine-network"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ployz-internal-secret.workspace = true
futures-util = "0.3"
ipnet = { version = "2.12", features = ["serde"] }
nix = { version = "0.31", features = ["net"] }
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
ureq = "3.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
netlink-packet-route = "0.30"
rtnetlink = "0.21"
wireguard-uapi = "3.0"

[dev-dependencies]
serde_json = "1"
