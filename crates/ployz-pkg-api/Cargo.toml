[package]
name = "ployz-pkg-api"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
oci-spec = { version = "=0.10.0", default-features = false, features = ["distribution"] }
ployz-internal-machine-api-pb = { path = "../ployz-internal-machine-api-pb" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }
