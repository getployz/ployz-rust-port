[package]
name = "ployz-internal-machine-cluster"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
ployz-internal-corrosion = { path = "../ployz-internal-corrosion" }
ployz-internal-dns = { path = "../ployz-internal-dns" }
ployz-internal-machine-api-pb = { path = "../ployz-internal-machine-api-pb" }
ployz-internal-machine-network = { path = "../ployz-internal-machine-network" }
ployz-internal-machine-store = { path = "../ployz-internal-machine-store" }
ployz-internal-secret = { path = "../ployz-internal-secret" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["float_roundtrip", "raw_value", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "sync"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync"] }
