[package]
name = "ployz-internal-machine-api-proxy"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
bytes = "=1.12.1"
fastrand = { version = "=2.5.0", default-features = false, features = ["std"] }
http = "=1.5.0"
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
ployz-internal-machine-api-pb = { path = "../ployz-internal-machine-api-pb" }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "=0.1.19", default-features = false, features = ["net"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
