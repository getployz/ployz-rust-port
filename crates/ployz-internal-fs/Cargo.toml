[package]
name = "ployz-internal-fs"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
default = ["files"]
files = ["dep:rustix"]
native = ["dep:libc"]

[dependencies]
libc = { version = "=0.2.189", default-features = false, optional = true }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process"], optional = true }
